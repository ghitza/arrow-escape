<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f8fbff">
  <title>Arrow Escape</title>
  <link rel="stylesheet" href="style.css?v=20260921-2">
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <div class="topbar__actions">
        <button class="icon-button" id="backButton" aria-label="Înapoi">◀</button>
        <button class="icon-button" id="undoButton" aria-label="Anulează ultima mișcare">↶</button>
        <button class="icon-button" id="restartButton" aria-label="Repornește nivelul">&#8634;</button>
      </div>

      <section class="level-status" aria-live="polite">
        <div class="level-status__name" id="levelName">NIVEL 1</div>
        <div class="hearts" id="hearts" aria-label="3 vieți"></div>
        <div class="life-timer" id="lifeTimer"></div>
      </section>

      <div class="wallet" aria-label="Portofel">
        <div class="wallet__item"><span class="coin">●</span><span id="coins">0</span></div>
        <div class="wallet__item"><span class="star">★</span><span id="stars">45</span></div>
      </div>
    </header>

    <section class="game-area">
      <div class="board-card" id="boardCard">
        <canvas id="gameCanvas" aria-label="Puzzle cu săgeți"></canvas>
        <div class="board-message" id="boardMessage" role="status"></div>
      </div>
    </section>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal__card">
      <div class="modal__icon" id="modalIcon">🎉</div>
      <h2 id="modalTitle">Nivel terminat!</h2>
      <p id="modalText"></p>
      <button class="primary-button" id="modalPrimary">URMĂTORUL NIVEL</button>
      <button class="secondary-button" id="modalSecondary" hidden>ÎNCHIDE</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="config.js?v=20260921-2"></script>
  <script src="script.js?v=20260921-3"></script>
</body>
</html>
